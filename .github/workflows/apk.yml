# Compila la app Android (carpeta app/) y deja el APK listo para descargar desde el celular en
# Releases > "App Android (última versión)".
name: APK de la app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Firma propia opcional: con estos dos secretos las actualizaciones se instalan encima sin desinstalar.
      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/firma.jks
          cat > android/key.properties <<PROPS
          storeFile=firma.jks
          storePassword=$KEYSTORE_PASS
          keyAlias=estados
          keyPassword=$KEYSTORE_PASS
          PROPS

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk ../estados-wa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: estados-wa-apk
          path: estados-wa.apk

      - name: Publicar en Releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAMA="${GITHUB_REF_NAME}"
          TAG="app-ultima"
          [ "$RAMA" != "main" ] && TAG="app-prueba"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" estados-wa.apk --prerelease --target "$GITHUB_SHA" \
            --title "App Android ($RAMA, build ${{ github.run_number }})" \
            --notes "Descarga estados-wa.apk desde el celular e instálalo. Rama: $RAMA, commit ${GITHUB_SHA::7}."
